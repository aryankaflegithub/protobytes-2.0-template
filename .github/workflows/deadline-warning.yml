name: Deadline Warning

on:
  schedule:

    - cron: '45 10 8 2 *'
    - cron: '50 10 8 2 *'
  
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  deadline-warning:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create warning file
        run: |
          echo "# ⚠️ DEADLINE APPROACHING!" > DEADLINE_WARNING.md
          echo "" >> DEADLINE_WARNING.md
          echo "## 🚨 PROTOBYTES HACKATHON 2.0" >> DEADLINE_WARNING.md
          echo "" >> DEADLINE_WARNING.md
          echo "**Warning issued:** $(TZ='Asia/Kathmandu' date '+%B %d, %Y at %I:%M %p NPT')" >> DEADLINE_WARNING.md
          echo "" >> DEADLINE_WARNING.md
          echo "### ⏰ Final Deadline: Falgun 2, 2025 at 11:59 PM NPT" >> DEADLINE_WARNING.md
          echo "" >> DEADLINE_WARNING.md
          echo "Time is running out! Make sure all your code is committed and pushed before the deadline." >> DEADLINE_WARNING.md
          echo "" >> DEADLINE_WARNING.md
          echo "---" >> DEADLINE_WARNING.md
          echo "" >> DEADLINE_WARNING.md
          echo "## ✅ Final Checklist" >> DEADLINE_WARNING.md
          echo "- Complete your code" >> DEADLINE_WARNING.md
          echo "- Fill SUBMISSION.md" >> DEADLINE_WARNING.md
          echo "- Test everything" >> DEADLINE_WARNING.md
          echo "- Push to GitHub" >> DEADLINE_WARNING.md
          echo "" >> DEADLINE_WARNING.md
          echo "**Commits after deadline will be DISQUALIFIED!**" >> DEADLINE_WARNING.md
      
      - name: Commit warning
        run: |
          git config user.name "PROTOBYTES Bot"
          git config user.email "actions@protobytes.hackathon"
          git add DEADLINE_WARNING.md
          if ! git diff --staged --quiet; then
            git commit -m "⚠️ Deadline warning - Time running out!"
            git push
          fi
      
      - name: Create warning issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "⚠️ DEADLINE APPROACHING - Action Required!" \
            --body "## ⚠️ Time is Running Out!

          **Final Deadline:** Falgun 2, 2025 at 11:59 PM NPT

          Make sure to complete and push all your code before the deadline.

          **Any commits after the deadline will be disqualified!**

          ### ✅ Action Items
          - Complete your code
          - Fill out SUBMISSION.md completely
          - Test everything works
          - Commit and push NOW

          Don't wait until the last minute!" \
            --label "deadline-warning,urgent"
